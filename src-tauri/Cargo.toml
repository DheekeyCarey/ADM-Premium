[package]
name = "adm-premium"
version = "4.0.0"
description = "Sistem Administrasi Guru Kelas - ADM Premium"
authors = ["Jacky Ardiyan, S.Pd"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "adm-premium"
path = "src/main.rs"
